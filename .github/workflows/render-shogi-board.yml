name: Render shogi boards

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "data/games.json"
      - "scripts/**"
      - ".github/workflows/render-shogi-board.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  render:
    # 同じリポジトリのPRブランチへ生成物を戻すため、fork PRでは実行しない。
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Generate Before and After SVG boards
        run: python scripts/render_pr_boards.py

      - name: Commit generated SVG boards
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: generate before and after shogi boards"
          branch: ${{ github.event.pull_request.head.ref }}

      - name: Add board preview to the pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- shogi-board-preview -->';
            const repo = context.repo;
            const headRepo = context.payload.pull_request.head.repo.full_name;
            const headRef = context.payload.pull_request.head.ref
              .split('/')
              .map(encodeURIComponent)
              .join('/');
            const rawBase = `https://raw.githubusercontent.com/${headRepo}/${headRef}/public`;
            const beforePath = `${process.env.GITHUB_WORKSPACE}/public/render-shogi-board-before.svg`;
            const before = fs.existsSync(beforePath)
              ? `### Before\n<img src="${rawBase}/render-shogi-board-before.svg" alt="Before shogi board" width="720">`
              : '### Before\n比較元の盤面はありません。';
            const after = `### After\n<img src="${rawBase}/render-shogi-board.svg" alt="After shogi board" width="720">`;
            const body = `${marker}\n## Shogi board preview\n\n${before}\n\n${after}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: repo.owner,
              repo: repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: repo.owner,
                repo: repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: repo.owner,
                repo: repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
