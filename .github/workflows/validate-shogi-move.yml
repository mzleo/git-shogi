name: Validate shogi move

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "data/games.json"
      - "scripts/**"
      - ".github/workflows/validate-shogi-move.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate SFEN and move transition
        run: python scripts/validate_game_transition.py
