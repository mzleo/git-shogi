[project]
name = "git-shogi"
version = "0.1.0"
description = "SFEN-based shogi board data and validation tools"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "black>=24,<26",
    "flake8>=7,<9",
    "pytest>=8,<9",
]

[tool.uv]
package = false

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
